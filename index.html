  <body class="bg-[#FFFAF5] text-[#34251E] antialiased selection:bg-[#F47B20]/20 selection:text-[#34251E]">
    <div id="root"></div>
    <script>
      window.WEDDING_THEMES = [
        { id: 'marigold-glass', name: 'Warm White & Marigold Orange', primary: '#F47B20', secondary: '#FFAD58', bg: '#FFFAF5' }
      ];
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        }).catch(function () {});
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
